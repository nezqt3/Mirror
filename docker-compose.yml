name: mirror

include:
  - backend/docker-compose.yml

services:
  desktop-build:
    image: mirror-desktop-build:local
    profiles: ["desktop"]
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
      target: artifact
    restart: "no"

  desktop-verify:
    image: mirror-desktop-verify:local
    profiles: ["verify"]
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
      target: verify
    restart: "no"
