services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mirror:mirror@postgres:5432/mirror
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn mirror.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mirror:mirror@postgres:5432/mirror
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A mirror.worker.celery_app:celery_app worker --loglevel=INFO
    volumes:
      - ./src:/app/src

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mirror_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mirror
      MINIO_ROOT_PASSWORD: mirror-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mirror_postgres_data:
  minio_data:
